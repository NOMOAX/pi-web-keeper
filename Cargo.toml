[package]
name         = "pi-web-keeper"
version      = "0.4.2"
edition      = "2021"
rust-version = "1.75"
description  = "Windows 启动器：托管唯一一个本地 Pi Web 服务"
license      = "MIT"

[[bin]]
name = "PiWebKeeper"
path = "src/main.rs"

[dependencies]
# 自绘 UI：eframe 提供 winit 事件循环 + glow 渲染后端，egui 负责画
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui   = "0.29"

# 托盘图标与右键菜单
tray-icon = "0.19"

# 从 eframe 的 Frame 里取出原生窗口句柄（版本必须与 eframe 依赖的一致）
raw-window-handle = "0.6"

# settings.json：json5 与原先 System.Text.Json 的 ReadCommentHandling/AllowTrailingCommas 对齐
serde  = { version = "1", features = ["derive"] }
json5  = "0.4"

# 单实例互斥名里的安装目录哈希（SHA-256 前 8 字节）
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# 把 .ico 里最大的一帧解成 RGBA，供窗口图标使用（见 build.rs）
png        = "0.17"
winresource = "0.1"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
